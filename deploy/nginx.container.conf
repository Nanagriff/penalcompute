# nginx inside the container. Plain HTTP on :80; Traefik in front terminates TLS
# and sets X-Forwarded-For / X-Forwarded-Proto.
server {
    listen 80 default_server;
    server_name _;

    root  /var/www/computation;
    index index.html;
    autoindex off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /feedback {
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 32k;
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 10s;
    }
    location = /feedback/health { proxy_pass http://127.0.0.1:8001; }

    # usage counts: the kind of computation and the version, nothing typed
    location = /usage {
        limit_except POST OPTIONS { deny all; }
        client_max_body_size 32k;
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 10s;
    }

    # the private side, behind the shared password (api/admin.py sets its own headers)
    # the app sends these four too; hide its copies so each header goes out once
    location = /admin {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options; proxy_hide_header Referrer-Policy; proxy_hide_header X-Robots-Tag;
    }
    location /admin/ {
        client_max_body_size 8k;
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 20s;
        proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options; proxy_hide_header Referrer-Policy; proxy_hide_header X-Robots-Tag;
    }

    location = /version.json         { add_header Cache-Control "no-store" always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /sw.js                { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /index.html           { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location /assets/                { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Robots-Tag "noindex, nofollow" always; }
    location = /robots.txt { }

    location / { try_files $uri /index.html; }

    location ~ /\.                          { deny all; }
    location ~ \.(sqlite3|db|py|env|hash)$  { deny all; }
}
